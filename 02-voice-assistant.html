<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuffetIQ design reference: Ask BuffetIQ</title>
<!-- Static snapshot of the approved design. Artboard size 390 x 844. Fictional data. Rebuild this look in Gradio; do not ship this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FD3C3}a:hover{color:#A8E6DA}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px 28px; background: #0E1415; color: #F4F1EA; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">

  <header style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 800">Ask BuffetIQ</h1>
      <span style="font-size: 14px; color: #A9B4B3">08:40 · Breakfast service</span>
    </div>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #7FD3C3; background: #172123; border: 1px solid #2C3A3C; border-radius: 999px; padding: 8px 12px">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #5BC0A8"></span>
      Board connected
    </span>
  </header>

  <section aria-label="Conversation" style="flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0">
    <div style="align-self: flex-end; max-width: 88%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
      <span style="font-size: 13px; color: #A9B4B3">You said · 08:40</span>
      <div style="background: #1F2B2D; border: 1px solid #3C4D4F; border-radius: 18px 18px 4px 18px; padding: 12px 16px; font-size: 17px; line-height: 1.4">How much egg should I cook?</div>
    </div>

    <div style="background: #172123; border: 2px solid #F2B33D; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 13px; font-weight: 600; color: #F2B33D">BuffetIQ answer</span>
      <div style="font-size: 28px; font-weight: 800; line-height: 1.15">Cook 4 kg of scrambled eggs now.</div>
      <div style="font-size: 17px; line-height: 1.45; color: #C9D1D0">Ready in 8 minutes. Two more batches are likely before 09:30.</div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px">
        <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #7FD3C3">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"></circle><path d="M7.5 12.5l3 3 6-6.5"></path></svg>
          Same numbers as the board
        </span>
        <button type="button" aria-label="Replay spoken answer" style="min-height: 44px; display: flex; align-items: center; gap: 8px; background: #1F2B2D; color: #F4F1EA; border: 1px solid #3C4D4F; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>
          Replay
        </button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px">
      <span style="font-size: 14px; color: #A9B4B3">Try asking</span>
      <div style="display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; padding-bottom: 2px">
        <button type="button" style="min-height: 44px; background: #172123; color: #F4F1EA; border: 1px solid #3C4D4F; border-radius: 999px; padding: 0 16px; font-family: inherit; font-size: 15px; white-space: nowrap; flex: none; cursor: pointer">What is running low?</button>
        <button type="button" style="min-height: 44px; background: #172123; color: #F4F1EA; border: 1px solid #3C4D4F; border-radius: 999px; padding: 0 16px; font-family: inherit; font-size: 15px; white-space: nowrap; flex: none; cursor: pointer">Any pans near 4 hours?</button>
        <button type="button" style="min-height: 44px; background: #172123; color: #F4F1EA; border: 1px solid #3C4D4F; border-radius: 999px; padding: 0 16px; font-family: inherit; font-size: 15px; white-space: nowrap; flex: none; cursor: pointer">When do I stop croissants?</button>
      </div>
    </div>
  </section>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
    <button type="button" aria-label="Hold to talk to BuffetIQ" style="width: 132px; height: 132px; border-radius: 66px; border: 6px solid #3A2D10; background: #F2B33D; color: #1A1300; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 17px; font-weight: 800; cursor: pointer">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
      Hold to talk
    </button>
    <button type="button" style="min-height: 44px; background: transparent; color: #7FD3C3; border: none; font-family: inherit; font-size: 16px; font-weight: 600; text-decoration: underline; cursor: pointer">Type a question instead</button>
  </div>
</div>

</body>
</html>
