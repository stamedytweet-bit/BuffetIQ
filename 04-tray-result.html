<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuffetIQ design reference: Tray check result</title>
<!-- Static snapshot of the approved design. Artboard size 390 x 844. Fictional data. Rebuild this look in Gradio; do not ship this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FD3C3}a:hover{color:#A8E6DA}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px 28px; background: #0E1415; color: #F4F1EA; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">

  <header style="display: flex; align-items: center; justify-content: space-between">
    <a href="CameraCheck.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      Tray check
    </a>
    <span style="font-size: 14px; color: #A9B4B3">Scrambled eggs · 08:40</span>
  </header>

  <div role="img" aria-label="Photo taken of the scrambled eggs tray" style="height: 170px; border-radius: 18px; background: #070B0C; border: 1px solid #2C3A3C; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #A9B4B3">[Photo of the scrambled eggs tray]</div>

  <section aria-label="Result" style="background: #172123; border: 2px solid #F2B33D; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="display: flex; align-items: center; gap: 10px; font-size: 48px; font-weight: 800; color: #F2B33D; line-height: 1">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L22 20H2L12 3.5z"></path><path d="M12 10v4.5"></path><path d="M12 17.2v.1"></path></svg>
        Low
      </span>
      <span style="font-size: 15px; font-weight: 700; color: #0E1415; background: #C9D1D0; border-radius: 999px; padding: 6px 12px">91% sure</span>
    </div>
    <div style="font-size: 18px; color: #C9D1D0">About 0.4 kg left of 2.5 kg</div>
    <div aria-label="Fill level scale" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
        <span style="width: 100%; height: 10px; border-radius: 5px; background: #2C3A3C"></span>
        <span style="font-size: 14px; color: #A9B4B3">Empty</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
        <span style="width: 100%; height: 10px; border-radius: 5px; background: #F2B33D"></span>
        <span style="font-size: 14px; font-weight: 800; color: #F2B33D">Low</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
        <span style="width: 100%; height: 10px; border-radius: 5px; background: #2C3A3C"></span>
        <span style="font-size: 14px; color: #A9B4B3">Half</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
        <span style="width: 100%; height: 10px; border-radius: 5px; background: #2C3A3C"></span>
        <span style="font-size: 14px; color: #A9B4B3">Full</span>
      </div>
    </div>
  </section>

  <section aria-label="Kitchen board update" style="background: #172123; border: 1px solid #2C3A3C; border-radius: 18px; padding: 16px 18px; display: flex; align-items: center; gap: 14px">
    <span style="flex: none; width: 40px; height: 40px; border-radius: 20px; background: #5BC0A8; color: #0B2420; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12.5l4 4 8-9"></path></svg>
    </span>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; color: #A9B4B3">Kitchen board updated</span>
      <span style="font-size: 19px; font-weight: 700">Scrambled eggs: cook 4 kg now</span>
    </div>
  </section>

  <div style="flex: 1"></div>

  <a href="CameraCheck.dc.html" style="min-height: 64px; border-radius: 16px; background: #F2B33D; color: #1A1300; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 20px; font-weight: 800; text-decoration: none">Check next tray</a>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <a href="CameraCheck.dc.html" style="min-height: 52px; border-radius: 14px; border: 2px solid #3C4D4F; background: #1F2B2D; color: #F4F1EA; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">Retake photo</a>
    <button type="button" style="min-height: 52px; border-radius: 14px; border: 2px solid #3C4D4F; background: #1F2B2D; color: #F4F1EA; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Wrong level? Fix it</button>
  </div>
</div>

</body>
</html>
